name: AdvancedBanReworked
version: ${project.version}
main: ${project.groupId}.bukkit.BukkitMain
authors: [Leoko, DarkIgnite]
softdepend: [Vault, Floodgate, floodgate]
api-version: 1.13

commands:
  AdvancedBan:
    description: Information about the Plugin
  ban:
    description: Ban a user permanently
  tempban:
    description: Ban a user temporarily
  ipban:
    description: Ban a user by IP
    aliases: [banip, ban-ip]
  tempipban:
    description: Ban a user temporarily by IP
    aliases: [tipban]
  kick:
    description: Kick a user
  warn:
    description: Warn a user permanently
  note:
    description: Adds a note to a users file
  tempwarn:
    description: Warn a user temporarily
  mute:
    description: Mute a user permanently
  tempmute:
    description: Mute a user temporarily
  banlist:
    description: See all punishments
  history:
    description: See a user''s history
  warns:
    description: See your or a user''s warns
  notes:
    description: See your or a user''s notes
  check:
    description: Get all information about a user
  systemPrefs:
    description: Displays System-Preferences for setting up the plugin
  unwarn:
    description: Deletes a warn
  unnote:
    description: Deletes a note
  unpunish:
    description: Deletes a punishment by ID
  unban:
    description: Unban a user
  unmute:
    description: Unmute a user
  change-reason:
    description: Change the reason of an existing punishment
  alts:
    description: Check all alt accounts of a user
    aliases: [alt, altcheck]
  guard:
    description: Analyze player connection, IP, country, and city accuracy
    aliases: [abguard]
  bandisguise:
    description: Toggle disguise mode to hide staff name in punishment broadcasts
    aliases: [bdisguise]  jail:
    description: Jail a user
    aliases: [penjara]
  tempjail:
    description: Jail a user temporarily
    aliases: [temppenjara]
  unjail:
    description: Release a user from jail
    aliases: [unpenjara]
